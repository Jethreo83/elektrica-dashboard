[pytest]
# Bare `pytest` (no file args) was collecting docs/superseded/phase1-sqlite-app's
# archived test suite alongside this repo's real tests, causing a module-name
# collision (two different `app` packages both importing as `app.models`) that
# made the whole run fail to collect. That archived Phase 1 app is intentionally
# kept for history (see docs/OVERNIGHT_DECISIONS.md "URGENT" entry) but must
# never be executed as part of this repo's real test suite. Found this cycle
# (2026-09-04) by running bare `pytest` instead of `pytest test_models.py
# test_api.py` -- the targeted form was masking this since whichever session
# wrote it never ran the bare form.
testpaths = .
norecursedirs = docs .git __pycache__ .pytest_cache
